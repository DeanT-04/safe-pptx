<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="safe-pptx banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
  </defs>
  <rect width="960" height="280" rx="18" fill="url(#bg)"/>
  <!-- scalpel-cut motif: a slide outline with one surgically replaced band -->
  <g transform="translate(80,60)">
    <rect x="0" y="0" width="120" height="160" rx="10" fill="none" stroke="#334155" stroke-width="6"/>
    <rect x="16" y="20" width="88" height="10" rx="5" fill="#475569"/>
    <rect x="16" y="42" width="64" height="10" rx="5" fill="#475569"/>
    <rect x="16" y="64" width="88" height="10" rx="5" fill="url(#accent)"/>
    <rect x="16" y="86" width="72" height="10" rx="5" fill="#475569"/>
    <rect x="16" y="108" width="80" height="10" rx="5" fill="#475569"/>
  </g>
  <text x="260" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#F8FAFC">safe-pptx</text>
  <text x="262" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#5EEAD4">surgical, format-preserving PowerPoint editing</text>
  <text x="262" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94A3B8">an MCP server for LLM-driven workflows — untouched content survives byte-identical</text>
  <rect x="262" y="222" width="120" height="26" rx="13" fill="#0D9488"/>
  <text x="322" y="240" font-family="Consolas, monospace" font-size="13" fill="#F0FDFA" text-anchor="middle">23 tools</text>
  <rect x="392" y="222" width="150" height="26" rx="13" fill="#1E293B"/>
  <text x="467" y="240" font-family="Consolas, monospace" font-size="13" fill="#94A3B8" text-anchor="middle">zero native deps</text>
  <rect x="552" y="222" width="130" height="26" rx="13" fill="#1E293B"/>
  <text x="617" y="240" font-family="Consolas, monospace" font-size="13" fill="#94A3B8" text-anchor="middle">200+ checks</text>
</svg>
